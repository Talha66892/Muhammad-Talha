<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Muhammad Talha</title>
    <link rel="stylesheet" href="style.css?v=6">
    <script src="script.js?v=11" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header>
        <a class="site-name" href="index.html">Muhammad Talha</a>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">About Me</a></li>
                <li><a href="interests.html">Technical Interests</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" aria-current="page">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section>
            <p>Get in touch</p>
            <h1>Contact Me</h1>
            <p>
                Use the form below to leave your contact details and a message.
            </p>
            <p>Required fields are marked with an asterisk.</p>
        </section>

        <form id="contact-form" novalidate>
            <div class="form-group">
                <label for="full-name">Full name *</label>
                <input type="text" id="full-name" name="full-name" autocomplete="name" aria-describedby="full-name-error" required>
                <p class="form-error" id="full-name-error"></p>
            </div>

            <div class="form-group">
                <label for="email">Email address *</label>
                <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error" required>
                <p class="form-error" id="email-error"></p>
            </div>

            <div class="form-group">
                <label for="subject">Subject *</label>
                <input type="text" id="subject" name="subject" aria-describedby="subject-error" required>
                <p class="form-error" id="subject-error"></p>
            </div>

            <div class="form-group">
                <label for="message">Message *</label>
                <textarea id="message" name="message" rows="6" aria-describedby="message-error" required></textarea>
                <p class="form-error" id="message-error"></p>
            </div>

            <button type="submit">Submit message</button>
            <p id="form-message" role="status" aria-live="polite"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Muhammad Talha</p>
    </footer>
</body>
</html>
